<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProConvert — Mobile App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background: #070a12;
            color: white;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .ad-zone {
            width: 180px;
            background: #11141b;
            border-left: 1px solid #1c212b;
            border-right: 1px solid #1c212b;
            display: flex; justify-content: center; align-items: center;
            color: #1a1f29; font-weight: 800; font-size: 30px; flex-shrink: 0;
            text-transform: uppercase; letter-spacing: 4px;
        }

        .app-wrapper {
            flex: 1; display: flex; flex-direction: column;
            padding: 40px; max-width: 900px; margin: 0 auto;
            min-height: 100vh; box-sizing: border-box;
        }

        header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; opacity: 0.6; }
        .logo { font-size: 20px; font-weight: 600; color: #3b82f6; }

        .main-controls {
            display: flex; flex-direction: column; gap: 20px;
            background: rgba(255, 255, 255, 0.02);
            padding: 25px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .dropzone {
            height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 12px; color: #4b5563; font-size: 15px;
            cursor: pointer; transition: 0.2s; gap: 8px; text-align: center;
        }
        .dropzone:hover, .dropzone.dragover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.03); color: #3b82f6; }

        .format-selector {
            position: relative; background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; cursor: pointer;
        }

        .selected-format {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; font-weight: 600; color: #3b82f6;
        }

        .format-dropdown {
            position: absolute; bottom: 100%; left: 0; width: 100%;
            max-height: 350px; overflow-y: auto;
            background: #0f172a; border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px; margin-bottom: 10px;
            display: none; z-index: 100; padding: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
        }
        .format-dropdown.show { display: block; }

        .format-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .format-option {
            padding: 12px; font-size: 12px; text-align: center;
            background: rgba(255,255,255,0.03); border-radius: 8px;
            transition: 0.2s; color: #9ca3af; font-weight: 500;
        }
        .format-option:hover { background: #1e293b; color: white; }
        .format-option.active { background: #3b82f6; color: white; }

        .action-btn {
            padding: 16px; border-radius: 10px; border: none;
            background: #3b82f6; color: white; font-weight: 600;
            font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { background: #2563eb; transform: translateY(-1px); }

        .file-list { margin-top: 25px; display: flex; flex-direction: column; gap: 8px; }
        .file-item {
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 12px 20px; border-radius: 12px; gap: 15px;
        }

        .file-name { flex: 1; font-size: 13px; color: #9ca3af; overflow: hidden; text-overflow: ellipsis; }
        .file-name span { color: #3b82f6; font-weight: 600; }

        .download-all-container { margin-top: 20px; display: none; justify-content: center; }
        .download-all-btn {
            background: transparent; color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 12px 30px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
        }

        .btn-group { display: flex; gap: 6px; }
        .btn-ui { padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; }
        .download { background: #3b82f6; color: white; }
        .delete { background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.1); }

        footer {
            margin-top: auto; padding: 40px 0 20px; text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .contact-link {
            font-size: 14px; color: #4b5563; cursor: pointer;
            transition: color 0.3s ease; font-weight: 500;
            display: inline-block; margin-bottom: 20px; position: relative;
        }
        .contact-link:hover { color: #3b82f6; }

        .tooltip { 
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%); 
            background: #3b82f6; color: white; padding: 4px 12px; border-radius: 6px; 
            font-size: 10px; opacity: 0; transition: 0.2s; pointer-events: none; 
        }
        .tooltip.show { opacity: 1; }

        .legal-links { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .legal-item { font-size: 9px; color: #1e293b; text-decoration: none; text-transform: uppercase; }
        .copyright-notice { font-size: 9px; color: #161b22; max-width: 600px; margin: 0 auto; line-height: 1.4; }

        @media (max-width: 800px) {
            body { flex-direction: column; }
            .ad-zone { display: none; }
            .app-wrapper { padding: 20px; }
            .format-grid { grid-template-columns: repeat(2, 1fr); }
            .file-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .btn-group { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="ad-zone">AD</div>
    <div class="app-wrapper">
        <header>
            <div class="logo">ProConvert</div>
            <div style="font-size: 10px; color: #1e293b;">PWA READY v5.1</div>
        </header>

        <div class="main-controls">
            <div class="dropzone" id="dropzone">
                <strong>Tap to Upload</strong>
                <span style="font-size: 11px; opacity: 0.5;">Select images to convert</span>
                <input type="file" id="fileInput" multiple hidden accept="image/*">
            </div>

            <div class="format-selector" id="formatToggle">
                <div class="selected-format">
                    <span id="currentTarget">Target: PNG</span>
                    <span>▼</span>
                </div>
                <div class="format-dropdown" id="dropdown">
                    <div class="format-grid">
                        <div class="format-option active" data-val="image/png">PNG</div>
                        <div class="format-option" data-val="image/jpeg">JPG</div>
                        <div class="format-option" data-val="image/webp">WEBP</div>
                        <div class="format-option" data-val="image/gif">GIF</div>
                        <div class="format-option" data-val="image/avif">AVIF</div>
                        <div class="format-option" data-val="image/x-icon">ICO</div>
                        <div class="format-option" data-val="image/tiff">TIFF</div>
                        <div class="format-option" data-val="image/bmp">BMP</div>
                        <div class="format-option" data-val="application/pdf">PDF</div>
                        <div class="format-option" data-val="image/svg+xml">SVG</div>
                    </div>
                </div>
            </div>

            <button class="action-btn" onclick="process()">CONVERT NOW</button>
        </div>

        <div class="file-list" id="list"></div>
        <div class="download-all-container" id="allContainer">
            <button class="download-all-btn" onclick="downloadAll()">DOWNLOAD ALL</button>
        </div>

        <footer>
            <div class="contact-link" onclick="copyEmail()">
                <span class="tooltip" id="copyTooltip">Copied!</span>
                ProConvert1@gmail.com
            </div>
            <div class="legal-links">
                <a href="#" class="legal-item">Privacy Policy</a>
                <a href="#" class="legal-item">Terms</a>
                <a href="#" class="legal-item">Compliance</a>
            </div>
            <div class="copyright-notice">© 2026 ProConvert App. All rights reserved.</div>
        </footer>
    </div>
    <div class="ad-zone">AD</div>

<script>
    // Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    const input = document.getElementById('fileInput');
    const list = document.getElementById('list');
    const dropzone = document.getElementById('dropzone');
    const dropdown = document.getElementById('dropdown');
    const allContainer = document.getElementById('allContainer');
    const targetLabel = document.getElementById('currentTarget');
    
    let queue = [];
    let selectedMime = "image/png";

    document.getElementById('formatToggle').onclick = (e) => {
        dropdown.classList.toggle('show');
        e.stopPropagation();
    };
    window.onclick = () => dropdown.classList.remove('show');

    document.querySelectorAll('.format-option').forEach(opt => {
        opt.onclick = (e) => {
            document.querySelectorAll('.format-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            selectedMime = opt.dataset.val;
            targetLabel.innerText = `Target: ${opt.innerText}`;
            e.stopPropagation();
        };
    });

    function handleFiles(files) {
        Array.from(files).forEach(f => {
            if (f.type.startsWith('image/')) {
                queue.push({ f, done: false, blob: null, resFormat: '' });
            }
        });
        render();
    }

    dropzone.onclick = () => input.click();
    input.onchange = () => handleFiles(input.files);
    dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
    dropzone.ondragleave = () => dropzone.classList.remove('dragover');
    dropzone.ondrop = (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); };

    function render() {
        list.innerHTML = queue.map((item, i) => {
            let name = item.f.name;
            if (item.done) {
                const base = name.substring(0, name.lastIndexOf('.'));
                name = `${base}.<span>${item.resFormat.toLowerCase()}</span>`;
            }
            return `
                <div class="file-item">
                    <div class="file-name">${name}</div>
                    <div class="btn-group">
                        ${item.done ? `<button class="btn-ui download" onclick="dl(${i})">Download</button>` : ''}
                        <button class="btn-ui delete" onclick="remove(${i})">Delete</button>
                    </div>
                </div>
            `;
        }).join('');
        allContainer.style.display = queue.some(q => q.done) ? 'flex' : 'none';
    }

    async function process() {
        const label = selectedMime.split('/').pop().replace('jpeg', 'jpg').replace('svg+xml', 'svg').toUpperCase();
        for(let i=0; i<queue.length; i++) {
            if(queue[i].done) continue;
            queue[i].blob = await new Promise(resolve => {
                const img = new Image();
                const url = URL.createObjectURL(queue[i].f);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob(b => { URL.revokeObjectURL(url); resolve(b); }, selectedMime);
                };
                img.src = url;
            });
            queue[i].done = true;
            queue[i].resFormat = label;
            render();
        }
    }

    function remove(i) { queue.splice(i, 1); render(); }
    function dl(i) {
        const a = document.createElement('a');
        const base = queue[i].f.name.substring(0, queue[i].f.name.lastIndexOf('.'));
        a.href = URL.createObjectURL(queue[i].blob);
        a.download = `${base}.${queue[i].resFormat.toLowerCase()}`;
        a.click();
    }

    function downloadAll() {
        queue.forEach((item, index) => {
            if (item.done) setTimeout(() => dl(index), index * 200);
        });
    }

    function copyEmail() {
        navigator.clipboard.writeText("ProConvert1@gmail.com").then(() => {
            const t = document.getElementById('copyTooltip');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        });
    }
</script>
</body>
</html>
